# Optional external CI. Nothing here has been triggered by source preparation.
# Running hosted CI may consume the account's build allowance.
workflows:
  memory-machine-android-test-apk:
    name: Memory Machine — standalone Android test APK
    max_build_duration: 60
    environment:
      node: 20.19.0
      java: 17
      groups:
        - memory_machine
      vars:
        EXPO_PUBLIC_DOMAIN: the-memory-machine.replit.app
    scripts:
      - name: Install dependencies
        script: |
          corepack enable
          corepack prepare pnpm@10.26.1 --activate
          pnpm install --frozen-lockfile
      - name: Check source
        script: pnpm run typecheck
      - name: Generate native Android project
        script: |
          cd artifacts/memory-machine-mobile
          npx expo prebuild --platform android --clean
      - name: Build bundled test APK
        script: |
          cd artifacts/memory-machine-mobile/android
          # A debug APK normally needs Metro; release embeds its JavaScript.
          # Expo's generated debug signing is for testing, NOT a store release.
          ./gradlew assembleRelease --no-daemon
    artifacts:
      - artifacts/memory-machine-mobile/android/app/build/outputs/apk/release/*.apk
