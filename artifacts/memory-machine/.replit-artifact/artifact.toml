kind = "web"
previewPath = "/"
title = "The Memory Machine"
version = "1.0.0"
id = "artifacts/happier-ai-vault"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 5173

[services.development]
run = "pnpm --filter @workspace/memory-machine run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/memory-machine", "run", "build" ]
publicDir = "artifacts/memory-machine/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "5173"
BASE_PATH = "/"
