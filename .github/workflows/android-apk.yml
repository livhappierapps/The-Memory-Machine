name: Android sideload APK

# Manual only. Do not add push/pull_request here — these builds are slow and
# this exists so a connected GitHub session can start a sideload build.
# Do not put a heredoc terminator at column 0 inside a run: | block.
# That ends the YAML block scalar and GitHub drops workflow_dispatch.
#
# assembleRelease, not assembleDebug. Debug APKs omit the JS bundle and wait
# for Metro. Sideloaded, that leaves the splash icon on screen forever.
on:
  workflow_dispatch:
    inputs:
      app:
        description: App folder under artifacts/
        required: true
        default: memory-machine-mobile
        type: choice
        options:
          - memory-machine-mobile
          - leo-app

jobs:
  apk:
    name: assembleRelease ${{ inputs.app }}
    # Pin past the Oct 19, 2026 ubuntu-latest -> Ubuntu 26 migration.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      # Host only. The app prefixes https:// and also accepts a full URL.
      EXPO_PUBLIC_DOMAIN: the-memory-machine.replit.app
      # Publishable test key already committed in eas.json. Empty key crashes
      # ClerkProvider after the splash hides.
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dGVuZGVyLWZhd24tMzUuY2xlcmsuYWNjb3VudHMuZGV2JA
      # Manual SDK install below — android-actions/setup-android@v3 is broken
      # on current runners (sdkmanager cannot find the 'tools' package).
      ANDROID_HOME: /usr/local/lib/android/sdk
      PATH: /usr/local/lib/android/sdk/cmdline-tools/latest/bin:/usr/local/lib/android/sdk/platform-tools:/usr/local/bin:/usr/bin:/bin
      # Reduce NDK architectures to save disk space
      ANDROID_ABI_FILTERS: arm64-v8a
      # Gradle optimization flags
      GRADLE_OPTS: "-Xmx2048m"
      ORG_GRADLE_PROJECT_android_enableBuildCache: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Free up disk space (cleanup runner)
        run: |
          set -euo pipefail
          df -h /
          echo "Cleaning up unnecessary packages..."
          sudo apt-get remove -y -qq '^ghc.*' '^postgresql.*' '^mysql.*' '^dotnet.*' || true
          sudo apt-get clean -qq || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /opt/hostedtoolcache/PyPy || true
          sudo rm -rf /opt/hostedtoolcache/go || true
          sudo rm -rf /opt/hostedtoolcache/Ruby || true
          sudo rm -rf /usr/share/swift || true
          df -h /

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          CMDLINE_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          mkdir -p "${SDK_ROOT}/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip "${CMDLINE_TOOLS_URL}"
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          rm -rf "${SDK_ROOT}/cmdline-tools/latest"
          mv /tmp/cmdtools/cmdline-tools "${SDK_ROOT}/cmdline-tools/latest"
          yes | "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${SDK_ROOT}" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" || true
          echo "Installed Android SDK to ${SDK_ROOT}"
          "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --version
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "${SDK_ROOT}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"
          df -h /

      - name: Install workspace
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile
          df -h /

      - name: Expo prebuild
        working-directory: artifacts/${{ inputs.app }}
        run: |
          set -euo pipefail
          npx expo prebuild --platform android --clean --no-install
          df -h /

      - name: Reinstall after prebuild
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile
          df -h /

      - name: Fix packaging and force debug signing on release
        working-directory: artifacts/${{ inputs.app }}
        run: python3 "$GITHUB_WORKSPACE/scripts/patch-android-packaging.py"

      - name: assembleRelease
        working-directory: artifacts/${{ inputs.app }}/android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          df -h /
          echo "Starting gradle release build (embeds JS bundle)..."
          ./gradlew assembleRelease --no-daemon --build-cache -PreactNativeArchitectures=arm64-v8a
          df -h /

      - name: Verify JS bundle is inside the APK
        working-directory: artifacts/${{ inputs.app }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "release APK missing"
            find android/app/build/outputs -type f -name '*.apk' || true
            exit 1
          fi
          if ! unzip -l "$APK" | grep -E 'index\.android\.bundle'; then
            echo "JS bundle not embedded — this APK would stick on the splash icon"
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.app }}-release-apk
          path: artifacts/${{ inputs.app }}/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
