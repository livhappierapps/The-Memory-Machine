name: Android debug APK

# Manual only. Do not add push/pull_request here — debug APKs are slow and
# this exists so a connected GitHub session can start a sideload build.
on:
  workflow_dispatch:
    inputs:
      app:
        description: App folder under artifacts/
        required: true
        default: memory-machine-mobile
        type: choice
        options:
          - memory-machine-mobile
          - leo-app

jobs:
  apk:
    name: assembleDebug ${{ inputs.app}}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_DOMAIN: https://the-memory-machine.replit.app
      # Manual SDK install below — android-actions/setup-android@v3 is broken
      # on current runners (sdkmanager cannot find the 'tools' package).
      ANDROID_HOME: /usr/local/lib/android/sdk
      PATH: /usr/local/lib/android/sdk/cmdline-tools/latest/bin:/usr/local/lib/android/sdk/platform-tools:/usr/local/bin:/usr/bin:/bin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          CMDLINE_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          mkdir -p "${SDK_ROOT}/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip "${CMDLINE_TOOLS_URL}"
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          rm -rf "${SDK_ROOT}/cmdline-tools/latest"
          mv /tmp/cmdtools/cmdline-tools "${SDK_ROOT}/cmdline-tools/latest"
          yes | "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${SDK_ROOT}" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" || true
          echo "Installed Android SDK to ${SDK_ROOT}"
          "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install workspace
        run: pnpm install --no-frozen-lockfile

      - name: Expo prebuild
        working-directory: artifacts/${{ inputs.app}}
        run: npx expo prebuild --platform android --clean --no-install

      - name: Reinstall after prebuild
        run: pnpm install --no-frozen-lockfile

      - name: Fix duplicate META-INF resources in app build.gradle
        working-directory: artifacts/${{ inputs.app}}
        run: |
          set -euo pipefail
          BUILD_GRADLE="android/app/build.gradle"
          if [ ! -f "${BUILD_GRADLE}" ]; then
            echo "ERROR: ${BUILD_GRADLE} not found after expo prebuild"
            exit 1
          fi
          # Resolve duplicate META-INF/versions/9/OSGI-INF/MANIFEST.MF from
          # okhttp3 logging-interceptor and jspecify jars (mergeDebugJavaResource).
          if ! grep -q "pickFirsts" "${BUILD_GRADLE}"; then
            cat >> "${BUILD_GRADLE}" <<'EOF'

    packaging {
        resources {
            pickFirsts += ["META-INF/versions/9/OSGI-INF/MANIFEST.MF"]
        }
    }
EOF
          fi
          echo "--- packaging block in ${BUILD_GRADLE} ---"
          grep -n "pickFirsts" "${BUILD_GRADLE}"

      - name: assembleDebug
        working-directory: artifacts/${{ inputs.app}}/android
        run: chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app }}-debug-apk
          path: artifacts/${{ inputs.app}}/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
