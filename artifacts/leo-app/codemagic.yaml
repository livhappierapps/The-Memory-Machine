workflows:
  leo-android-apk:
    name: Leo App — Android APK
    max_build_duration: 60
    environment:
      node: 20.19.0
      java: 17
      groups:
        - leo_secrets
    cache:
      cache_paths:
        - $HOME/.pnpm-store
    scripts:
      - name: Enable Corepack (use repo pnpm, do not npm -g)
        script: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm --version

      - name: Install workspace dependencies
        script: |
          if [ -f ../../pnpm-workspace.yaml ]; then
            cd ../..
          fi
          pnpm install --no-frozen-lockfile

      - name: Expo prebuild
        script: |
          if [ -d artifacts/leo-app ]; then
            cd artifacts/leo-app
          fi
          npx expo prebuild --platform android --clean

      - name: Build debug APK
        script: |
          if [ -d artifacts/leo-app/android ]; then
            cd artifacts/leo-app/android
          else
            cd android
          fi
          ./gradlew assembleDebug --no-daemon

    artifacts:
      - artifacts/leo-app/android/app/build/outputs/apk/debug/app-debug.apk
      - android/app/build/outputs/apk/debug/app-debug.apk

    publishing:
      email:
        recipients:
          - livhappierapps@gmail.com
        notify:
          success: true
          failure: true
