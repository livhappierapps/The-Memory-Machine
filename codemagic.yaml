workflows:
  leo-android-apk:
    name: Leo App — Android APK
    max_build_duration: 60
    environment:
      node: 20.19.0
      java: 17
      vars:
        CI: "1"
        EXPO_NO_TELEMETRY: "1"
    cache:
      cache_paths:
        - $HOME/.pnpm-store
        - $CM_BUILD_DIR/artifacts/leo-app/node_modules
    scripts:
      - name: Enable Corepack (use repo pnpm, do not npm -g)
        script: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm --version

      - name: Install workspace dependencies
        script: |
          pnpm install --no-frozen-lockfile

      - name: Expo prebuild
        script: |
          cd artifacts/leo-app
          # --no-install: do not prompt "Install the updated dependencies?"
          npx expo prebuild --platform android --clean --no-install
          cd ../..
          pnpm install --no-frozen-lockfile

      - name: Build debug APK
        script: |
          cd artifacts/leo-app/android
          ./gradlew assembleDebug --no-daemon

    artifacts:
      - artifacts/leo-app/android/app/build/outputs/apk/debug/app-debug.apk

    publishing:
      email:
        recipients:
          - livhappierapps@gmail.com
        notify:
          success: true
          failure: true

  android-apk:
    name: Memory Machine — Android APK
    max_build_duration: 60
    environment:
      node: 20.19.0
      java: 17
      vars:
        CI: "1"
        EXPO_NO_TELEMETRY: "1"
        EXPO_PUBLIC_DOMAIN: https://the-memory-machine.replit.app
      groups:
        - memory_machine
    cache:
      cache_paths:
        - $HOME/.pnpm-store
        - $CM_BUILD_DIR/node_modules/.cache
    scripts:
      - name: Enable Corepack (use repo pnpm, do not npm -g)
        script: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm --version

      - name: Install workspace dependencies
        script: pnpm install --no-frozen-lockfile

      - name: Expo prebuild (generate android/ folder)
        script: |
          cd artifacts/memory-machine-mobile
          npx expo prebuild --platform android --clean --no-install
          cd ../..
          pnpm install --no-frozen-lockfile

      - name: Build debug APK
        script: |
          cd artifacts/memory-machine-mobile/android
          ./gradlew assembleDebug --no-daemon

    artifacts:
      - artifacts/memory-machine-mobile/android/app/build/outputs/apk/debug/app-debug.apk

    publishing:
      email:
        recipients:
          - livhappierapps@gmail.com
        notify:
          success: true
          failure: true
